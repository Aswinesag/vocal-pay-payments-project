<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - VocalPay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glassmorphism {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.5s; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="glassmorphism w-16 h-16 mx-auto rounded-xl flex items-center justify-center mb-4">
                <i class="fas fa-microphone text-3xl text-purple-400"></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">Sign Up</h1>
            <p class="text-slate-400">Create your VocalPay account</p>
        </div>
        
        <div class="glassmorphism rounded-3xl p-8 shadow-2xl">
            <form id="signupForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">
                        <i class="fas fa-user mr-2"></i>Full Name
                    </label>
                    <input type="text" id="full_name" required minlength="2"
                        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                        placeholder="John Doe">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">
                        <i class="fas fa-envelope mr-2"></i>Email
                    </label>
                    <input type="email" id="email" required
                        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                        placeholder="your@email.com">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">
                        <i class="fas fa-phone mr-2"></i>Phone Number
                    </label>
                    <input type="tel" id="phone_number" required minlength="10"
                        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                        placeholder="9876543210">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">
                        <i class="fas fa-lock mr-2"></i>Password
                    </label>
                    <input type="password" id="password" required minlength="8"
                        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                        placeholder="••••••••">
                    <p class="text-xs text-slate-500 mt-1">Min 8 characters</p>
                </div>
                
                <div id="error-message" class="hidden p-4 bg-red-500/20 border border-red-500 rounded-xl">
                    <p class="text-red-400 text-sm"><i class="fas fa-exclamation-circle mr-2"></i><span id="error-text"></span></p>
                </div>
                
                <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-semibold rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg">
                    Create Account
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-slate-400">
                    Already have an account? 
                    <a href="/signin" class="text-purple-400 hover:text-purple-300 font-semibold">Sign In</a>
                </p>
            </div>
        </div>
    </div>
    
    <div id="loading" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="glassmorphism rounded-2xl p-8 text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-4 border-purple-500 border-t-transparent mx-auto mb-4"></div>
            <p class="text-white font-medium">Creating account...</p>
        </div>
    </div>
    
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                phone_number: document.getElementById('phone_number').value,
                password: document.getElementById('password').value
            };
            
            const errorDiv = document.getElementById('error-message');
            const loading = document.getElementById('loading');
            
            loading.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            
            try {
                const response = await fetch('/api/v1/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const loginForm = new URLSearchParams();
                    loginForm.append('username', formData.email);
                    loginForm.append('password', formData.password);
                    
                    const loginResponse = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: loginForm
                    });
                    
                    const loginData = await loginResponse.json();
                    if (loginResponse.ok) {
                        localStorage.setItem('access_token', loginData.access_token);
                        localStorage.setItem('user', JSON.stringify(loginData.user));
                        window.location.href = '/enroll';  // Redirect to biometric enrollment
                    } else {
                        window.location.href = '/signin';
                    }
                } else {
                    throw new Error(data.detail || 'Registration failed');
                }
            } catch (error) {
                document.getElementById('error-text').textContent = error.message;
                errorDiv.classList.remove('hidden');
                errorDiv.classList.add('shake');
                setTimeout(() => errorDiv.classList.remove('shake'), 500);
            } finally {
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
