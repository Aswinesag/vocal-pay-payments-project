<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - VocalPay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glassmorphism {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.5s; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="glassmorphism w-16 h-16 mx-auto rounded-xl flex items-center justify-center mb-4">
                <i class="fas fa-microphone text-3xl text-indigo-400"></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">Sign In</h1>
            <p class="text-slate-400">Welcome back to VocalPay</p>
        </div>
        
        <div class="glassmorphism rounded-3xl p-8 shadow-2xl">
            <form id="signinForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">
                        <i class="fas fa-envelope mr-2"></i>Email
                    </label>
                    <input type="email" id="email" required
                        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="your@email.com">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">
                        <i class="fas fa-lock mr-2"></i>Password
                    </label>
                    <input type="password" id="password" required
                        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="••••••••">
                </div>
                
                <div id="error-message" class="hidden p-4 bg-red-500/20 border border-red-500 rounded-xl">
                    <p class="text-red-400 text-sm"><i class="fas fa-exclamation-circle mr-2"></i><span id="error-text"></span></p>
                </div>
                
                <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg">
                    Sign In
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-slate-400">
                    Don't have an account? 
                    <a href="/signup" class="text-indigo-400 hover:text-indigo-300 font-semibold">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
    
    <div id="loading" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="glassmorphism rounded-2xl p-8 text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-4 border-indigo-500 border-t-transparent mx-auto mb-4"></div>
            <p class="text-white font-medium">Signing in...</p>
        </div>
    </div>
    
    <script>
        document.getElementById('signinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const loading = document.getElementById('loading');
            
            loading.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            
            try {
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);
                
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData,
                    credentials: 'include'  // Enable cookies
                });
                
                if (response.ok) {
                    // Token now stored in httpOnly cookie automatically
                    // No localStorage needed!
                    window.location.href = '/dashboard';
                } else {
                    const data = await response.json();
                    throw new Error(data.detail || 'Invalid credentials');
                }
            } catch (error) {
                document.getElementById('error-text').textContent = error.message;
                errorDiv.classList.remove('hidden');
                errorDiv.classList.add('shake');
                setTimeout(() => errorDiv.classList.remove('shake'), 500);
            } finally {
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
